# Runs the unit tests, the scene checks, the linter and the check that each layer stands alone.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.8-beta4
  GUT_VERSION: v9.7.1
  GDTOOLKIT_VERSION: 4.5.0

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mkdir -p "$HOME/.local/bin"
          ln -s "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install GUT
        run: |
          git clone --quiet --depth 1 --branch "$GUT_VERSION" https://github.com/bitwes/Gut "$RUNNER_TEMP/gut"
          cp -r "$RUNNER_TEMP/gut/addons/gut" addons/gut
      - name: Lint
        run: |
          pip install --quiet "gdtoolkit==$GDTOOLKIT_VERSION"
          gdlint character_system tests addons/character_system_warnings test_level
      - name: Each layer loads without the ones built on it
        # Before the full import, so the copies have no import cache to lean on.
        run: |
          check() {  # check <name of the copy> <folders to delete from it>...
            local copy="$RUNNER_TEMP/$1"; shift
            mkdir "$copy"
            cp -r project.godot character_system "$copy/"
            for folder in "$@"; do rm -rf "$copy/character_system/$folder"; done
            godot --headless --path "$copy" --import 2>&1 | tee layer.log
            ! grep -E "SCRIPT ERROR|Parse Error" layer.log
            godot --headless --path "$copy" -s "$PWD/tests/check_scripts_load.gd"
          }
          check core_only character starter_pack
          check core_and_character starter_pack
      - name: Import the project
        run: |
          godot --headless --import 2>&1 | tee import.log
          ! grep -E "SCRIPT ERROR|Parse Error" import.log
      - name: Unit tests
        run: godot --headless -s addons/gut/gut_cmdln.gd -gexit
      - name: Scene checks
        run: godot --headless --fixed-fps 60 res://tests/immunity_test/immunity_test.tscn
      - name: Test level
        run: godot --headless --fixed-fps 60 res://test_level/test_level.tscn -- --self-test
